name: A股消息雷达

on:
  workflow_dispatch:  # 手动触发

permissions:
  contents: write

jobs:
  fetch-and-filter:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch news
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: python3 scripts/fetch_news.py

      - name: AI filter
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          HUOSHAN_API_KEY: ${{ secrets.HUOSHAN_API_KEY }}
        run: python3 scripts/ai_filter.py

      - name: Dedup reports
        run: python3 scripts/dedup_reports.py

      - name: Build site
        run: python3 scripts/build.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f reports/ site/data/
          git diff --quiet && git diff --staged --quiet || git commit -m "Update: $(date '+%Y-%m-%d %H:%M')"
          git push
